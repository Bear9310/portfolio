{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card glass-card border-0 shadow">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock fs-1 text-primary"></i>
                        <h3 class="mt-2 fw-bold">Admin Login</h3>
                        <p class="text-secondary small">Only for portfolio owner</p>
                    </div>
                    <form method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg bg-dark border-secondary text-light"
                                   autofocus required autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg bg-dark border-secondary text-light"
                                   required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center mt-3">
                <a href="{{ url_for('home') }}" class="text-secondary small"><i class="bi bi-arrow-left"></i> Back to portfolio</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
