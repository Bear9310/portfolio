{% extends "base.html" %}
{% block title %}{{ post.title }} · Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <a href="{{ url_for('blog') }}" class="btn btn-sm btn-outline-secondary mb-4">← Back to Blog</a>
            <h1 class="fw-bold mb-3">{{ post.title }}</h1>
            <p class="text-muted mb-4">{{ post.created_at.strftime('%B %d, %Y') }}</p>
            <div class="text-secondary" style="white-space: pre-line; line-height: 1.7;">
                {{ post.content }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
